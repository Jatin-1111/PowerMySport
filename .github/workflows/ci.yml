name: CI — Lint & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1 — Format check (Prettier)
  # ──────────────────────────────────────────────────────────────────────
  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — ESLint (all four apps)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint — ${{ matrix.app }}
    runs-on: ubuntu-latest
    # Pre-existing violations: reports lint errors without blocking PRs.
    # Remove once the backlog is cleared.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  lint-server:
    name: ESLint — server
    runs-on: ubuntu-latest
    # Server lint uses warn-only rules — exits 0 always. No continue-on-error needed.
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────
  # JOB 3 — TypeScript / Build validation (all four apps)
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Silence Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

  build-server:
    name: Build — server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: npm run build
