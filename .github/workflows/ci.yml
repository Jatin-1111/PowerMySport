name: CI — Lint, Typecheck, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1 — Prettier format check (hard failure)
  # ──────────────────────────────────────────────────────────────────────
  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — ESLint — Next apps (continue-on-error: pre-existing backlog)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint — ${{ matrix.app }}
    runs-on: ubuntu-latest
    # Pre-existing violations: reports without blocking. Remove once cleared.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────
  # JOB 3 — ESLint — server (warn-only rules, exits 0 always)
  # ──────────────────────────────────────────────────────────────────────
  lint-server:
    name: ESLint — server
    runs-on: ubuntu-latest
    # Server lint uses warn-only rules — exits 0 always. No continue-on-error needed.
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────
  # JOB 4 — TypeScript type-check — Next apps (matrix, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npm run typecheck

  # ──────────────────────────────────────────────────────────────────────
  # JOB 5 — Vitest suite — client (18 test files, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  test-client:
    name: Vitest — client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  # ──────────────────────────────────────────────────────────────────────
  # JOB 6 — Build — Next apps (matrix, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────────────────────────────────
  # JOB 7 — Build — server TypeScript (hard failure)
  # ──────────────────────────────────────────────────────────────────────
  build-server:
    name: Build — server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # JOB 8 — Single required gate for branch protection
  #
  # Branch protection needs only this ONE job name. This job succeeds only
  # when every hard-failure job above passes. Lint is continue-on-error so
  # it never blocks this gate — it still runs and reports, but pre-existing
  # violations don't stop merges.
  # ──────────────────────────────────────────────────────────────────────
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - format
      - typecheck
      - test-client
      - build
      - build-server
      - lint-server

    steps:
      - run: echo "All required checks passed ✅"
