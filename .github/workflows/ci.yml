name: CI — Lint, Typecheck, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1 — Prettier format check (hard failure)
  # ──────────────────────────────────────────────────────────────────────
  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — ESLint — Next apps (continue-on-error: pre-existing backlog)
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint — ${{ matrix.app }}
    runs-on: ubuntu-latest
    # Pre-existing violations: reports without blocking. Remove once cleared.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # admin/client/community are npm workspaces — there is no per-app
      # lockfile, so install once at the repo root.
      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=${{ matrix.app }}

  # ──────────────────────────────────────────────────────────────────────
  # JOB 3 — ESLint — server (warn-only rules, exits 0 always)
  # ──────────────────────────────────────────────────────────────────────
  lint-server:
    name: ESLint — server
    runs-on: ubuntu-latest
    # Server lint uses warn-only rules — exits 0 always. No continue-on-error needed.
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────────
  # JOB 4 — TypeScript type-check — Next apps (matrix, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: npm run typecheck --workspace=${{ matrix.app }}

  # ──────────────────────────────────────────────────────────────────────
  # JOB 5 — Vitest suite — client (18 test files, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  test-client:
    name: Vitest — client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test --workspace=client

  # ──────────────────────────────────────────────────────────────────────
  # JOB 6 — Build — Next apps (matrix, hard failure)
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin, community]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build --workspace=${{ matrix.app }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ──────────────────────────────────────────────────────────────────────
  # JOB 7 — Build — server TypeScript (hard failure)
  # ──────────────────────────────────────────────────────────────────────
  build-server:
    name: Build — server (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────────────
  # JOB 8 — Server test suite (hard failure)
  #
  # Previously this only ran in deploy-server.yml, i.e. AFTER a merge to
  # master — a broken server test could still land on master via a PR and
  # only fail post-merge, too late to block anything. Run it here too so
  # it gates the PR itself, same as every other hard-failure job.
  # ──────────────────────────────────────────────────────────────────────
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: build-server
    defaults:
      run:
        working-directory: server

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379

  # ──────────────────────────────────────────────────────────────────────
  # JOB 9 — Single required gate for branch protection
  #
  # Branch protection needs only this ONE job name. This job succeeds only
  # when every hard-failure job above passes. Lint is continue-on-error so
  # it never blocks this gate — it still runs and reports, but pre-existing
  # violations don't stop merges.
  # ──────────────────────────────────────────────────────────────────────
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - format
      - typecheck
      - test-client
      - build
      - build-server
      - test-server
      - lint-server

    steps:
      - run: echo "All required checks passed ✅"
